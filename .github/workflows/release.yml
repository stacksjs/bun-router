name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      # Build the dist before publishing. `pantry publish` doesn't run
      # npm's `prepublishOnly` script (the workspace setup invokes a
      # different publish path), so without an explicit build step we
      # were shipping a stale `dist/` from whatever happened to be on
      # the builder. v0.0.8 went out missing the applyMacros call in
      # enhanceRequest because of this. Run the workspace build script
      # so the package's `dist/` is regenerated from current source.
      - name: Build package
        working-directory: packages/bun-router
        run: bun --bun build.ts

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
