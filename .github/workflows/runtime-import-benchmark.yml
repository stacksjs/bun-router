name: Runtime import diagnostic

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: Fresh-process pairs per entry
        required: true
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0

      - name: Install latest stable Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Measure fresh-process imports
        env:
          BENCH_PAIRS: ${{ inputs.pairs }}
        run: bun run bench:runtime-import -- --pairs="$BENCH_PAIRS" --output=bench/runtime-import/results/ci.json

      - name: Upload raw diagnostic
        uses: actions/upload-artifact@v6.0.0
        with:
          name: runtime-import-diagnostic
          path: bench/runtime-import/results/ci.json
          if-no-files-found: error
